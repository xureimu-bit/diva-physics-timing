[Physics]
; 0 = diagnostic passthrough; 1 = experimental 30 Hz secondary physics.
; Reloaded in-game every 500 ms. Changing this does not change render FPS.
Mode=0
; 0 = validated two-pose interpolation; 1 = three-pose osage display smoothing.
; Smoothing 1 adds half a 30 Hz tick (~17 ms) to secondary deformation only.
Smoothing=0

; 0 = existing render-time roots; 1 = sample animated osage roots at fixed 30 Hz times.
; Independent of display smoothing. Physical parent outputs are never resampled.
ResampleRoots=0

; Capture pose coordinates from the root actually consumed by native physics.
; 0 = legacy late parent snapshot; 1 = corrected callback-time root capture.
CaptureRoots=0

; 0 = hold latest native osage pose; 1 = normal osage display interpolation.
; Both preserve 30 Hz simulation and high-FPS body/root attachment. Cloth unchanged.
InterpolateOsage=1

; 0 = legacy uniform-grid display blend; 1 = bracket actual capture timestamps.
; Only two-pose osage interpolation changes; simulation and body timing stay native.
TimeAwareInterpolation=0

; Experimental rate comparison: 30 or 40 Hz; hot reload resets pose histories.
PhysicsHz=30

; Increment a positive token to capture at most 30 seconds in memory.
; Diagnostic snapshots do not modify physics inputs or write files each frame.
MotionTrace=0
MotionTraceSeconds=30

; Trial for Miku tail Main path only; shared body, cloth and skirts are untouched.
; Coordinate animated translation, private ancestor references and body collider centers.
TranslationInputs=0

; Requires TranslationInputs=1. Miku tails only: sample root rotation and position
; together; rotate callback-private colliders consistently, without resampling
; physical-parent outputs or changing shared body/skinning matrices.
RigidInputs=0

; Hair and skirt/clothing rates: 20..60 Hz; 0 inherits legacy PhysicsHz.
; Other/body secondary physics remains on PhysicsHz.
HairHz=30
ClothingHz=30
HairEnabled=1
ClothingEnabled=1
; Display interpolation and extra hair smoothing; no force/velocity changes.
HairInterpolation=1
HairSmoothing=0
ClothingInterpolation=1
